name: Release

# Publishes to PyPI via trusted publishing when a GitHub release is published.
# One-time setup: add this repo as a trusted publisher at https://pypi.org/manage/account/publishing/
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
