[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sfsu-agents"
dynamic = ["version"]
description = "Unofficial agent toolkit for SFSU public web services: class schedule, catalog, directory, and events over MCP + CLI with an evidence-envelope contract."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pierre Guirguis" }]
keywords = ["mcp", "agents", "sfsu", "san-francisco-state", "class-schedule", "llm-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "ruff>=0.6", "build", "twine", "sfsu-agents[mcp]"]

[project.urls]
Homepage = "https://github.com/guirguispierre/sfsu-agents"
Repository = "https://github.com/guirguispierre/sfsu-agents"
Issues = "https://github.com/guirguispierre/sfsu-agents/issues"
Changelog = "https://github.com/guirguispierre/sfsu-agents/blob/main/CHANGELOG.md"

[project.scripts]
sfsu-agents = "sfsu_agents.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sfsu_agents = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "sfsu_agents.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
